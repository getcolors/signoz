# Golden fixture: DigitalOcean, opt-out mode. An explicit `digitalocean-ssh-keys`
# means the package touches no key material at all: it renders a literal key id
# on the droplet and no digitalocean_ssh_key resource. `digitalocean-name` is
# set to the profile, the override in its no-op form.
profile: signoz-digitalocean-optout
workdir: WORKDIR

provider-compute: digitalocean
provider-dns: cloudflare
provider-backend: local

compute-prevent-destroy: true

signoz-host: signoz.example.com
signoz-root-email: admin@signoz.example.com
signoz-root-org-name: default

signoz-image: signoz/signoz:v0.138.0
signoz-collector-image: signoz/signoz-otel-collector:v0.144.8
signoz-clickhouse-image: clickhouse/clickhouse-server:25.12.5
signoz-clickhouse-keeper-image: clickhouse/clickhouse-keeper:25.12.5
signoz-postgres-image: postgres:16.15
signoz-caddy-image: caddy:2.11.4
signoz-histogram-quantile-version: v0.0.1
signoz-ingestion-token-file: /etc/signoz/ingestion.env

signoz-backup-dir: /var/backups/signoz
signoz-backup-r2-bucket: signoz-backup
signoz-backup-r2-endpoint: https://example.eu.r2.cloudflarestorage.com
signoz-backup-r2-region: auto
signoz-backup-oncalendar: "*-*-* 02:30:00"
signoz-backup-retention-days: 7

digitalocean-name: signoz-digitalocean-optout
digitalocean-region: ams3
digitalocean-size: s-4vcpu-8gb
digitalocean-image: ubuntu-24-04-x64

# Opt-out mode: an existing account key id, supplied by the operator. The
# package neither generates nor removes key material in this mode.
digitalocean-ssh-keys: "00000000"

digitalocean-ssh-sources:
  - 0.0.0.0/0
  - "::/0"
digitalocean-http-sources:
  - 0.0.0.0/0
  - "::/0"

r2-bucket: tofu-state-example
r2-endpoint: https://example.eu.r2.cloudflarestorage.com
