---
- name: Stop SigNoz services before infrastructure deletion
  hosts: signoz
  become: true
  gather_facts: false
  tasks:
    - ansible.builtin.systemd_service:
        name: signoz-backup.timer
        state: stopped
        enabled: false
      failed_when: false
    - ansible.builtin.command: docker compose down
      args: {chdir: /opt/signoz}
      register: compose_down
      changed_when: "'Removed' in (compose_down.stderr + compose_down.stdout)"
      failed_when: false
